[workspace]
members = ["crates/*", "tools/*"]
resolver = "3"

[workspace.package]
authors = ["Travis Brown <travisrobertbrown@gmail.com>"]
repository = "https://github.com/travisbrown/archivindex-substack"
readme = "README.md"
keywords = ["substack", "web", "archive"]
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
archivindex-substack-model = { version = "0.1.0", path = "crates/model" }
archivindex-substack-scraper = { version = "0.1.0", path = "crates/scraper" }
archivindex-warc = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex-warc", default-features = false, features = [
  "gzip",
  "http",
] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
indicatif = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
url = "2"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
